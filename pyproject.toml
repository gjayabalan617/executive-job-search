[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "executive-job-search"
version = "0.1.0"
description = "Read-only executive technology job discovery and screening for a single candidate profile."
requires-python = ">=3.11"
# NOTE: the specification names httpx. It could not be installed in the build sandbox
# (PyPI blocked by the egress proxy), so HTTP goes through executive_job_search.http.HttpClient
# which wraps `requests`. See README "Deviations from the specification".
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30"]
dev = ["pytest>=8"]

[project.scripts]
executive-job-search = "executive_job_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
